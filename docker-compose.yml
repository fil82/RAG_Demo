#   docker compose up --build
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  ingest:
    build:
      context: ./app
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "services.ingestion", "--recreate-index"]
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - HF_HOME=/cache/hf
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - hf-cache:/cache/hf

  api:
    build:
      context: ./app
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - HF_HOME=/cache/hf
    depends_on:
      elasticsearch:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    volumes:
      - hf-cache:/cache/hf

volumes:
  hf-cache:
