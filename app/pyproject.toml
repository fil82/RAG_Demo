[project]
name = "rag-demo"
version = "0.1.0"
description = "Document Q&A API with vector search (RAG demo)"
authors = [{ name = "Filip Dimitrov" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "elasticsearch>=8.12,<9",
    "langchain-text-splitters>=0.2",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["../tests"]
addopts = "--import-mode=importlib"
markers = [
    "acceptance: end-to-end tests that need a running stack (Elasticsearch + API)",
]

[tool.ruff]
line-length = 88
target-version = "py310"
